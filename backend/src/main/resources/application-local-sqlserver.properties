# Local SQL Server development: mirrors SQL Server migrations while keeping the local OTP bypass.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.flyway.locations=classpath:db/migration/sqlserver
visualizer.auth.local-otp=1234
# Flyway's SQL Server scripts define the schema; Hibernate type validation is off (see application-azure.properties).
spring.jpa.hibernate.ddl-auto=none
# Azure SQL / SQL Server store times in DATETIME2 columns. Bind java.time.Instant as a plain TIMESTAMP
# (not Hibernate 6's default TIMESTAMP_UTC/datetimeoffset, which the driver cannot read back from DATETIME2)
# and always in UTC, whatever the JVM's time zone.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
