server.port=8080
spring.profiles.default=local

visualizer.max-code-length=20000
visualizer.max-steps=2000
visualizer.max-stdout-chars=20000
visualizer.timeout-ms=10000
visualizer.max-displayed-frames=50
visualizer.max-heap-objects=500
visualizer.max-array-elements=100
visualizer.max-heap-depth=8
visualizer.max-concurrent=4
visualizer.rate-limit-requests=60
visualizer.rate-limit-window-ms=60000
visualizer.rate-limit-max-clients=10000
visualizer.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Local development database. Azure uses the `azure` profile and SQL Server below.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/java-visualizer;MODE=MSSQLServer}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/${DB_MIGRATION_VENDOR:h2}
visualizer.auth.jwt-ttl-seconds=1800
visualizer.auth.jwt-secret=${VISUALIZER_JWT_SECRET:}
visualizer.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
visualizer.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Email OTP delivery through Brevo. Never commit these values.
visualizer.email.brevo-api-key=${VISUALIZER_BREVO_API_KEY:}
visualizer.email.sender-email=${VISUALIZER_EMAIL_SENDER:}
visualizer.email.sender-name=${VISUALIZER_EMAIL_SENDER_NAME:Java Visualizer}

# Legacy JDBC session support remains only for the initial schema migration transition.
