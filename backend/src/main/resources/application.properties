server.port=8080

visualizer.max-code-length=20000
visualizer.max-steps=2000
visualizer.max-stdout-chars=20000
visualizer.timeout-ms=10000
visualizer.max-displayed-frames=50
visualizer.max-heap-objects=500
visualizer.max-array-elements=100
visualizer.max-heap-depth=8
visualizer.max-concurrent=4
visualizer.rate-limit-requests=60
visualizer.rate-limit-window-ms=60000
visualizer.rate-limit-max-clients=10000
visualizer.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
