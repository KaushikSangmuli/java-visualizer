# Hosted profile (Azure Container Apps + Azure SQL Database). Activate with SPRING_PROFILES_ACTIVE=azure.
# Required secrets/variables: DB_URL, DB_USERNAME, DB_PASSWORD, VISUALIZER_JWT_SECRET (32+ bytes),
# VISUALIZER_BREVO_API_KEY, VISUALIZER_EMAIL_SENDER, CORS_ALLOWED_ORIGINS (exact frontend URL).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Azure SQL free tier pauses when idle; give the first connection time to resume it.
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.locations=classpath:db/migration/sqlserver
# Flyway's versioned scripts define the schema. Hibernate's type validation is turned off for SQL Server
# because NVARCHAR/DATETIME2 column types differ from Hibernate's defaults; H2 tests still validate.
spring.jpa.hibernate.ddl-auto=none
visualizer.auth.jwt-secret=${VISUALIZER_JWT_SECRET}
visualizer.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
visualizer.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:None}
# Requests arrive through the Container Apps ingress; use the client address it appends.
visualizer.trust-forwarded-for=true
