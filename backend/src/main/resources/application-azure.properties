# Activate with SPRING_PROFILES_ACTIVE=azure and configure DB_URL, DB_USERNAME, and DB_PASSWORD.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.flyway.locations=classpath:db/migration/sqlserver
visualizer.auth.jwt-secret=${VISUALIZER_JWT_SECRET}
visualizer.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
visualizer.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:None}
