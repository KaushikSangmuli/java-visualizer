# CI on every pull request and push to main; deployment on push to main (or manual run) once the
# Azure resources and repository settings described in docs/DEPLOYMENT.md exist. Until then the
# deploy jobs are skipped, so pushing never fails because Azure is not set up yet.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - name: Keep test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend build (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          VITE_API_BASE_URL: ${{ vars.BACKEND_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  image:
    name: Backend image (Docker)
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        name: Image name (ghcr.io requires lowercase)
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          tags: ${{ steps.names.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image has the JDK compiler and debugger and runs as non-root
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          docker run --rm --entrypoint sh "${{ steps.names.outputs.image }}" -c \
            'javac -version && java --list-modules | grep -q "^jdk.jdi@" && test "$(id -u)" = "10001" && echo "image ok"'

  deploy-backend:
    name: Deploy backend (Azure Container Apps)
    needs: [image, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_CONTAINERAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out the new image
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.image.outputs.image }}"
      - name: Smoke test /health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "${{ vars.BACKEND_URL }}/health" | grep -q '"ok"'; then echo "backend healthy"; exit 0; fi
            sleep 10
          done
          echo "backend did not become healthy" && exit 1

  deploy-frontend:
    name: Deploy frontend (Azure Static Web Apps)
    needs: [frontend, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_CONTAINERAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
